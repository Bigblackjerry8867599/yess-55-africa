<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mealhippo | Preview</title>
    <meta name="description" content="mealhippo offers curated hospitality experiences that connect passionate hosts with community-minded attendees.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Marcellus&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3e362e;
            --secondary: #000000;
            --dark: #3e362e;
            --light: #000000;
            --accent: #ffd166;
            --text: #333333;
            --other: #fffdd0;
            --some: #ffffff;
            --card-bg: #1a1a1a;
            --dark-amethyst: #32174d;

            /* hero / brand background — dark olive */
            --brand-forest: #556b2f;

            --font-display: 'Marcellus', 'Playfair Display', Georgia, serif;
            --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

            --card-w: 260px;
            --card-h: 340px;
            --ring-radius: 300px;
            --ring-stage-pad: 94px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            color: #ffffff;
            background-color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
            padding-top: 0 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        h1, h2, h3 { text-wrap: balance; }

        ::selection {
            background: var(--accent);
            color: var(--brand-forest);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 3px;
        }

        /* ===== SLIM NAV ===== */
        nav {
            position: sticky;
            top: 0;
            background: var(--brand-forest);
            z-index: 1000;
            border-bottom: none;
            padding: 0;
            height: 22px;
            display: flex;
            align-items: center;
            font-family: var(--font-body);
            overflow: visible;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        #nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0;
            padding: 0;
        }

        #nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1;
            display: block;
            letter-spacing: 0.04em;
            transition: color 0.3s ease;
        }

        #nav-links a:hover { color: var(--accent); }

        #nav-links .nav-cta {
            background-color: var(--accent);
            color: var(--primary);
            padding: 0.15rem 0.7rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-family: var(--font-body);
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 17px;
            letter-spacing: 0.04em;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover {
            background-color: var(--light);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-secondary:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* ===== HERO ===== */
        .hero-body {
            background: var(--brand-forest);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        section.hero {
            position: relative;
            padding-top: 0 !important;
            margin-top: 0 !important;
            background: var(--brand-forest);
            overflow: hidden;
        }

        .hero-container {
            max-width: 100%;
            margin: 0 auto;
            min-height: auto;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            overflow: hidden;
        }

        .hero-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
            overflow: hidden;
            margin-left: 5%;
        }

        .hero-column:nth-child(1) {
            margin-top: 0;
            width: 55%;
            position: relative;
            margin-left: 5%;
            padding: 0 20px 40px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .hero-column:nth-child(2) {
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 0;
            margin-left: 0;
            background: transparent;
            position: relative;
        }

        .hero-lady {
            width: 100%;
            max-width: 720px;
            height: auto;
            object-fit: contain;
            object-position: bottom center;
            background: transparent;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.35));
            animation: floatLady 6s ease-in-out infinite;
            image-rendering: -webkit-optimize-contrast;
            will-change: transform;
            pointer-events: none;
            margin-top: 420px;
        }

        @keyframes floatLady {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        .headline-right {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            background-color: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.45);
            padding: 8px 26px 8px 30px;
            border-radius: 50px;
