<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MealHippo — Book a seat at a curated dinner in Kampala</title>
    <meta name="description" content="MealHippo is curated dinners in Kampala. Book a seat, show up, eat well, meet interesting people.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #556b2f;
            --dark: #1a1a1a;
            --accent: #ffd166;
            --text: #333333;
            --light-bg: #ffffff;
            --grey-bg: #f7f7f5;
            --border: #e8e8e8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text);
            background: var(--light-bg);
            line-height: 1.6;
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Inter', sans-serif; letter-spacing: -0.02em; line-height: 1.1; color: #111; }
        .container { width: 90%; max-width: 1080px; margin: 0 auto; }

        /* ===== NAV - YC SIMPLE ===== */
        nav {
            position: sticky; top: 0; background: #fff; z-index: 1000;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }
        .nav-container { width: 90%; max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #111; text-decoration: none; letter-spacing: -0.03em; }
        .logo span { color: var(--primary); }
        #nav-links { list-style: none; display: flex; align-items: center; gap: 1.5rem; }
        #nav-links a { text-decoration: none; color: #333; font-size: 1rem; font-weight: 500; }
        #nav-links a:hover { color: var(--primary); }
        .nav-cta { background: #111; color: #fff !important; padding: 10px 18px; border-radius: 8px; font-weight: 600 !important; font-size: 0.95rem !important; }

        /* ===== HERO - YC CLEAR ===== */
        .hero {
            padding: 70px 0 50px;
            background: #fff;
            text-align: left;
        }
        .hero-badge {
            display: inline-block;
            background: #fff8e1;
            border: 1px solid #ffeaa7;
            color: #7a5a00;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
        }
        .hero h1 {
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 800;
            max-width: 720px;
            margin-bottom: 16px;
        }
        .hero h1 span { color: var(--primary); }
        .hero p.sub {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #555;
            max-width: 620px;
            margin-bottom: 28px;
        }
        .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .btn {
            display: inline-block; padding: 14px 26px; border-radius: 10px;
            text-decoration: none; font-weight: 700; font-size: 1.05rem; border: none; cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #44571f; }
        .btn-secondary { background: #fff; color: #111; border: 1.5px solid #ddd; }
        .btn-secondary:hover { border-color: #111; }
